<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creative Writing Projects</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<script>
    fetch("nav.html")
        .then(response => response.text())
        .then(html => {
            document.getElementById("navbar-container").innerHTML = html;
        });
</script>

<body>

    <header class="banner">
        <h1>Abby's Website</h1>
        <p>This is not for you.</p>
    </header>

<!-- Navigation Bar -->
<div id="navbar-container"></div>

<main class="content">
        <h2>Nanowrimo 2017</h2>
        <h2>Nanowrimo 2020</h2>
</main>

    <!-- Footer -->
    <footer>
        <p>&copy; <span id="copyright-year"></span> Abby Cicone. All Rights Reserved.</p>
    </footer>

</body>
</html>
